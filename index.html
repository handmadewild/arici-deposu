<footer>
  <h2 style="color:var(--sari)">Sosyal Medyada Arıcı Deposu</h2>
  <div class="sosyal">
    <a id="altIg" href="https://instagram.com" target="_blank" style="background:#dc2743">📸 Instagram Mağazamız</a>
    <a id="altYt" href="https://youtube.com" target="_blank" style="background:#DC2626">▶️ YouTube Kanalımız</a>
    <a id="altWp" href="https://wa.me" target="_blank" style="background:#16A34A">💬 WhatsApp Hattımız</a>
  </div>
  <p style="font-size:13px;color:#A7F3D0">© 2026 Arıcı Deposu — Tüm Hakları Saklıdır.</p>
</footer>
<div class="modal" id="modal" onclick="if(event.target===this)sepetAc()">
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>🛒 Sipariş Sepetiniz</h3>
      <button onclick="sepetAc()" style="border:none;background:none;font-size:24px;cursor:pointer">×</button>
    </div>
    <div class="liste" id="liste"></div>
    <div>
      <div style="display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-bottom:12px">
        <span>Toplam:</span><span id="toplam" style="color:#B45309">0 TL</span>
      </div>
      <button class="wp-btn" onclick="wpGonder()">💬 WhatsApp ile Sipariş Ver</button>
      <button class="ig-btn" onclick="igGonder()">📸 Sepeti Kopyala & Instagram'a Git</button>
    </div>
  </div>
</div>
<div class="admin-modal" id="adminModal">
  <div class="admin-kutu">
    <div class="admin-ust">
      <h3>⚙️ Arıcı Deposu Yönetim Paneli</h3>
      <button onclick="document.getElementById('adminModal').classList.remove('acik')" style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer">×</button>
    </div>
    <div class="admin-sekmeler">
      <button class="admin-sekme aktif" onclick="sekmeAc('urunSekme',this)">📦 Ürün & Stok Yönetimi</button>
      <button class="admin-sekme" onclick="sekmeAc('muhasebeSekme',this)">💰 Kasa & Muhasebe</button>
      <button class="admin-sekme" onclick="sekmeAc('ayarSekme',this)">🔗 İletişim & Sosyal Medya</button>
    </div>
    <div class="admin-govde">
      <div id="urunSekme">
        <div class="form-grid">
          <input type="text" id="uAd" placeholder="Ürün Adı">
          <select id="uKat">
            <option value="Kovan & Çıta">Kovan & Çıta</option>
            <option value="Koruyucu Kıyafet">Koruyucu Kıyafet</option>
            <option value="El Aletleri">El Aletleri</option>
            <option value="Hasat & Bakım">Hasat & Bakım</option>
          </select>
          <input type="number" id="uAlis" placeholder="Alış Fiyatı (TL)">
          <input type="number" id="uFiyat" placeholder="Satış Fiyatı (TL)">
          <input type="number" id="uStok" placeholder="Stok Adedi">
          <input type="text" id="uAciklama" placeholder="Kısa Açıklama">
          <input type="text" id="uResim" placeholder="Resim Linki (İsteğe bağlı)">
        </div>
        <button class="kaydet-btn" onclick="urunEkle()">+ Ürünü Kaydet ve Yayınla</button>
        <table>
          <thead><tr><th>Ürün</th><th>Kategori</th><th>Alış/Satış</th><th>Stok</th><th>İşlem</th></tr></thead>
          <tbody id="adminUrunTablo"></tbody>
        </table>
      </div>
      <div id="muhasebeSekme" style="display:none">
        <div class="form-grid">
          <select id="mTur"><option value="Gelir">Gelir (+)</option><option value="Gider">Gider (-)</option></select>
          <input type="text" id="mKalem" placeholder="İşlem Başlığı">
          <input type="number" id="mTutar" placeholder="Tutar (TL)">
          <input type="text" id="mAciklama" placeholder="Not">
        </div>
        <button class="kaydet-btn" onclick="muhasebeEkle()">+ Kayıt Ekle</button>
        <table>
          <thead><tr><th>Tarih</th><th>Tür</th><th>Başlık</th><th>Tutar</th><th>Açıklama</th></tr></thead>
          <tbody id="adminMuhasebeTablo"></tbody>
        </table>
      </div>
      <div id="ayarSekme" style="display:none">
        <div class="form-grid">
          <input type="text" id="aWp" placeholder="WhatsApp No (905xxxxxxxxx)">
          <input type="text" id="aIg" placeholder="Instagram Linki">
          <input type="text" id="aYt" placeholder="YouTube Linki">
          <input type="text" id="aSifre" placeholder="Yönetim Şifresi">
        </div>
        <button class="kaydet-btn" onclick="ayarlariKaydet()">💾 Ayarları Kaydet</button>
      </div>
    </div>
  </div>
</div>
<script>
const API_URL="https://google.com";
let urunler=[],muhasebe=[],ayarlar={whatsapp:"905000000000",instagram:"https://instagram.com",youtube:"https://youtube.com",sifre:"1234"},seciliKat="Tümü",sepet=[];
async function verileriYukle(){
  try{
    const r=await fetch(API_URL),d=await r.json();
    if(d.urunler)urunler=d.urunler;
    if(d.muhasebe)muhasebe=d.muhasebe;
    if(d.ayarlar)d.ayarlar.forEach(a=>ayarlar[a.anahtar]=String(a.deger));
    document.getElementById("ustIg").href=ayarlar.instagram;document.getElementById("altIg").href=ayarlar.instagram;
    document.getElementById("ustYt").href=ayarlar.youtube;document.getElementById("altYt").href=ayarlar.youtube;
    document.getElementById("altWp").href="https://wa.me"+ayarlar.whatsapp;
    ciz();
  }catch(e){console.error(e)}
}
function ciz(){
  const v=document.getElementById("vitrin"),q=document.getElementById("ara").value.toLowerCase();
  v.innerHTML="";
  const f=urunler.filter(u=>(seciliKat==="Tümü"||u.kategori===seciliKat)&&(String(u.ad).toLowerCase().includes(q)||String(u.aciklama).toLowerCase().includes(q)));
  if(!f.length){v.innerHTML="<p style='grid-column:1/-1;text-align:center;padding:40px'>Malzeme bulunamadı.</p>";return}
  f.forEach(u=>{
    const g=u.resim?`<img src="${u.resim}" alt="${u.ad}">`:"🐝",s=Number(u.stok)>0;
    v.innerHTML+=`<div class="kart"><div><div class="gorsel"><span class="etiket">${u.kategori}</span>${g}<span class="stok-etiket" style="color:${s?'#059669':'#DC2626'}">${s?'✔ Stokta ('+u.stok+')':'✖ Tükendi'}</span></div><div class="icerik"><h3>${u.ad}</h3><p>${u.aciklama||''}</p><div class="fiyat">${Number(u.fiyat).toLocaleString('tr-TR')} TL</div></div></div><div class="alt-btn"><button class="ekle" ${!s?'disabled':''} onclick="ekle('${u.id}')">+ Sepete Ekle</button><a href="${ayarlar.instagram}" target="_blank" class="sor">📸 IG'den Sor</a></div></div>`;
  });
}
function katSec(k,el){seciliKat=k;document.querySelectorAll(".kat").forEach(b=>b.classList.remove("aktif"));el.classList.add("aktif");ciz()}
function ekle(id){const u=urunler.find(x=>String(x.id)===String(id));if(!u)return;const s=sepet.find(x=>String(x.id)===String(id));s?s.adet++:sepet.push({id:u.id,ad:u.ad,fiyat:Number(u.fiyat),adet:1});sepetCiz()}
function degis(i,d){sepet[i].adet+=d;if(sepet[i].adet<=0)sepet.splice(i,1);sepetCiz()}
function sepetCiz(){
  document.getElementById("sayac").textContent=sepet.reduce((t,s)=>t+s.adet,0);
  document.getElementById("toplam").textContent=sepet.reduce((t,s)=>t+s.fiyat*s.adet,0).toLocaleString('tr-TR')+" TL";
  const l=document.getElementById("liste");
  l.innerHTML=sepet.length?sepet.map((s,i)=>`<div class="satir"><div><b>${s.ad}</b><br><small>${s.fiyat} TL x ${s.adet}</small></div><div><button onclick="degis(${i},-1)">-</button> <b>${s.adet}</b> <button onclick="degis(${i},1)">+</button></div></div>`).join(""):"<p style='text-align:center;color:#777;margin-top:30px'>Sepetiniz boş.</p>";
}
function sepetAc(){document.getElementById("modal").classList.toggle("acik")}
function metin(){let m="Merhaba Arıcı Deposu, siparişim:\n\n";sepet.forEach(s=>m+=`• ${s.ad} (${s.adet} Adet) = ${s.fiyat*s.adet} TL\n`);return m+"\nToplam: "+document.getElementById("toplam").textContent}
function wpGonder(){if(!sepet.length)return alert("Sepetiniz boş");window.open("https://wa.me"+ayarlar.whatsapp+"?text="+encodeURIComponent(metin()),"_blank")}
function igGonder(){if(!sepet.length)return alert("Sepetiniz boş");navigator.clipboard.writeText(metin());alert("Siparişiniz kopyalandı, Instagram mesaj kutusuna yapıştırabilirsiniz.");window.open(ayarlar.instagram,"_blank")}
function yonetimAc(){
  if(prompt("Yönetim Şifresi:")!==ayarlar.sifre)return alert("Hatalı şifre!");
  document.getElementById("aWp").value=ayarlar.whatsapp;document.getElementById("aIg").value=ayarlar.instagram;document.getElementById("aYt").value=ayarlar.youtube;document.getElementById("aSifre").value=ayarlar.sifre;
  adminCiz();document.getElementById("adminModal").classList.add("acik");
}
function sekmeAc(id,btn){["urunSekme","muhasebeSekme","ayarSekme"].forEach(s=>document.getElementById(s).style.display="none");document.getElementById(id).style.display="block";document.querySelectorAll(".admin-sekme").forEach(b=>b.classList.remove("aktif"));btn.classList.add("aktif")}
function adminCiz(){
  document.getElementById("adminUrunTablo").innerHTML=urunler.map(u=>`<tr><td>${u.ad}</td><td>${u.kategori}</td><td>${u.alis_fiyat}/${u.fiyat} TL</td><td>${u.stok}</td><td><button class="sil-btn" onclick="urunSil('${u.id}')">Sil</button></td></tr>`).join("");
  document.getElementById("adminMuhasebeTablo").innerHTML=muhasebe.map(m=>`<tr><td>${String(m.tarih).slice(0,10)}</td><td>${m.tur}</td><td>${m.kalem}</td><td>${m.tutar} TL</td><td>${m.aciklama||''}</td></tr>`).join("");
}
async function apiGonder(islem,veri){await fetch(API_URL,{method:"POST",body:JSON.stringify({islem,veri})});await verileriYukle();adminCiz()}
async function urunEkle(){
  const v={id:Date.now(),kategori:document.getElementById("uKat").value,ad:document.getElementById("uAd").value,alis_fiyat:Number(document.getElementById("uAlis").value||0),fiyat:Number(document.getElementById("uFiyat").value||0),stok:Number(document.getElementById("uStok").value||0),aciklama:document.getElementById("uAciklama").value,resim:document.getElementById("uResim").value};
  if(!v.ad)return alert("Ürün adı girin.");await apiGonder("urun_kaydet",v);alert("Kaydedildi!");
}
